<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Simon Says Game</h1>
    <h2>Press Play to Start</h2>

    <div class="btn-container">
        <div class="line1">
            <div class="btn red" id="red">1</div>
            <div class="btn green" id="green">2</div>
        </div>
        <div class="line2">
            <div class="btn yellow" id="yellow">3</div>
            <div class="btn purple" id="purple">4</div>
        </div>

        <button id="startBtn">▶ Play Game</button>
    </div>

    <!-- Instructions Box -->
    <div class="instructions">
        <h3>How to Play</h3>
        <ul>
            <li>Press any key to start the game.</li>
            <li>Watch the color pattern carefully.</li>
            <li>Repeat the pattern by clicking buttons.</li>
            <li>Each level adds one more color.</li>
            <li>If you click wrong → Game Over.</li>
            <li>Try to beat your highest score!</li>
        </ul>
    </div>

<script src="script.js"></script>
</body>
</html>
